services:
  airflow-spark:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080" # Airflow webserver
      - "4040:4040" # Spark UI
      - "8888:8888" # Jupyter Lab
      - "8081:8081" # dbt docs
    volumes:
      - ./airflow/dags:/home/airflow/dags
      - ./airflow/tpch_analytics:/home/airflow/tpch_analytics
      - ./notebooks:/home/airflow/notebooks
